<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Military Simulator — Command Center</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app">
    <header class="command-bar">
      <div class="brand">
        <span class="brand-icon">⬡</span>
        <div>
          <h1>Military Simulator</h1>
          <span class="brand-sub">Strict prompt skill · Combat · Drag &amp; Drop</span>
        </div>
      </div>

      <div class="transport">
        <button id="btnPlay" class="transport-btn" title="Play">▶</button>
        <button id="btnPause" class="transport-btn" title="Pause" disabled>⏸</button>
        <button id="btnSpeed" class="transport-btn speed-btn" title="1x / 2x">1×</button>
        <span class="transport-sep"></span>
        <button id="btnRanges" class="transport-btn toggle on">RADAR</button>
        <button id="btnRoutes" class="transport-btn toggle on">ROUTES</button>
      </div>

      <div class="status-indicators">
        <span id="aiStatus" class="status-pill muted">AI …</span>
        <span id="simStatus" class="status-pill">PAUSED</span>
        <span id="unitCount" class="status-pill">0 UNITS</span>
        <span id="scenarioTitle" class="status-pill muted">NO SCENARIO</span>
      </div>
    </header>

    <div class="workspace">
      <aside class="sidebar">
        <section class="panel">
          <h2 class="panel-title">Local AI Model</h2>
          <select id="modelSelect" class="model-select"></select>
          <p class="hint">Skill: js/ai/skills.md — only units named in the prompt</p>
        </section>

        <section class="panel">
          <h2 class="panel-title">Scenario Prompt</h2>
          <textarea id="promptInput" rows="5"
            placeholder="Name each unit, start location, and stationed or waypoints…&#10;e.g. 2 blue tanks stationed west of Kyiv; 1 red fighter transits from the east toward the city"></textarea>
          <div class="btn-row">
            <button id="btnGenerate" class="btn primary">Generate</button>
            <button id="btnClear" class="btn ghost">Clear</button>
          </div>
        </section>

        <section class="panel">
          <h2 class="panel-title">Map Tools</h2>
          <label class="field-label">Mode</label>
          <select id="modeSelect" class="model-select">
            <option value="select">Select / Drag</option>
            <option value="add">Add unit (click map)</option>
            <option value="waypoint">Add waypoint (click map)</option>
          </select>
          <div class="tool-grid">
            <div>
              <label class="field-label">Type</label>
              <select id="addTypeSelect" class="model-select"></select>
            </div>
            <div>
              <label class="field-label">Side</label>
              <select id="addSideSelect" class="model-select">
                <option value="blue">Blue</option>
                <option value="red">Red</option>
              </select>
            </div>
          </div>
          <div class="btn-row">
            <button id="btnDelete" class="btn ghost danger">Delete selected</button>
            <button id="btnClearWp" class="btn ghost">Clear WPs</button>
          </div>
          <p id="selectedInfo" class="hint">None selected</p>
        </section>

        <section class="panel">
          <h2 class="panel-title">Force Composition</h2>
          <div id="forceSummary" class="force-summary"></div>
        </section>

        <section class="panel flex-grow">
          <h2 class="panel-title">Active Units</h2>
          <ul id="unitList" class="unit-list"></ul>
        </section>
      </aside>

      <main class="map-area"><div id="map"></div></main>

      <aside class="log-panel">
        <h2 class="panel-title">Operations Log</h2>
        <div id="logEntries" class="log-entries"></div>
      </aside>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/core/constants.js"></script>
  <script src="js/core/utils.js"></script>
  <script src="js/core/Simulation.js"></script>
  <script src="js/units/BaseUnit.js"></script>
  <script src="js/units/GroundUnits.js"></script>
  <script src="js/units/AirUnits.js"></script>
  <script src="js/units/NavalUnits.js"></script>
  <script src="js/units/AirDefense.js"></script>
  <script src="js/units/Facilities.js"></script>
  <script src="js/units/UnitFactory.js"></script>
  <script src="js/map/MapController.js"></script>
  <script src="js/ai/OllamaClient.js"></script>
  <script src="js/ai/ScenarioSkill.js"></script>
  <script src="js/ai/ScenarioGenerator.js"></script>
  <script src="js/ui/Sidebar.js"></script>
  <script src="js/ui/LogPanel.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
